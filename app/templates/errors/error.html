{% extends "base.html" %}

{% block title %}{{ code }} {{ heading }}{% endblock %}

{% block content %}
<style>
    .err-wrap { max-width: 560px; margin: 8vh auto 0; text-align: center; }
    .err-code { font-size: 68px; font-weight: 800; color: var(--border-input); line-height: 1; letter-spacing: 2px; }
    .err-heading { font-size: 20px; font-weight: 700; color: var(--text-main); margin: 12px 0 8px; }
    .err-desc { color: var(--text-muted); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
    .err-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>

<div class="err-wrap">
    <div class="err-code">{{ code }}</div>
    <div class="err-heading">{{ heading }}</div>
    <div class="err-desc">{{ description }}</div>
    <div class="err-actions">
        <a class="ui-btn-primary" href="{{ back_url }}">返回上一页</a>
        {% if current_user.is_authenticated %}
        <a class="ui-btn-secondary" href="{{ url_for('auth.login') }}">回到首页</a>
        {% endif %}
    </div>
</div>
{% endblock %}
